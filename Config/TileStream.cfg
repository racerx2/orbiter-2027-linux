; not upstream: the planet tile stream (Src/Orbiter/TileStream.cpp) fills Textures/<Body> (Surf, Mask, Elev, Class, Elev_mod, Cloud, Bldg, Way)
; from these free, keyless servers while the sim runs; Orbiter.cfg: TileStream, TileStreamOffline, TileStreamCacheMB, TileStreamBuildings, TileStreamWays
; SURF eox <url> <first level> <last level>          EOX WGS84 grid, 256 px, zoom = level - 3
; SURF_FALLBACK gibs <url> <top GIBS level> <last level>
; LIGHTS, WATER gibs <url> <top GIBS level>          NASA GIBS EPSG:4326 grid, 512 px
; ELEV terrarium <url> <top zoom> <last level>       Web Mercator elevation tiles, 256 px, zoom = level - 3; ELEV_SCALE metres per step
; COVER worldcover <url> <first level>               ESA WorldCover 10 m COGs, {tile} = N27W081: the Mask water bit and the Class layer
; BLDG <TileJSON url> <last known {z}/{x}/{y} url>   z14 vector tiles (OpenMapTiles): layer building to Textures/<Body>/Bldg,
;                                                    transportation, aeroway and waterway to Textures/<Body>/Way (not upstream, design-ways)
; {z} {n} grid level, {row} {col} tile
; CLOUD <small equirect> <large equirect> <last level>  NASA Visible Earth clouds: L1-L5 from the small image at startup, the rest in the background
; FLOOR <lng0> <lat0> <lng1> <lat1> <metres>         below sea level: elevation inside the box stops at <metres> instead of 0, the first match wins
; CREDIT <text>                                      one line each, shown on the Launchpad page Options > Planet streaming, http(s) addresses as links
; SURF cog <url> <first level> <last level>          a Cloud-Optimized GeoTIFF (degrees or equirectangular metres) read by byte ranges in the job (mars-stream)
; DETAIL cog <url> <first> <last> <lng0> <lat0> <lng1> <lat1>  past SURF's levels inside the box: SURF's colour times this file over its own low-pass
; ELEV cog <url> <first level> <last level>          heights in metres from a COG; a body with cog sources has no LIGHTS, WATER, COVER or BLDG, so no Mask
; RETIRE <list>                                      Config/TileStream/<list>: an old pack's files (size, CRC-32), deleted once when they match exactly
; PALETTE <brightness> <r> <g> <b>                    two or more, rising brightness 0 to 255: a cog SURF's colour from its brightness (luma), linear between the points

