; not upstream: the planet tile stream (Src/Orbiter/TileStream.cpp) fills Textures/<Body>/Surf and Mask
; from these free, keyless servers while the sim runs; Orbiter.cfg: TileStream, TileStreamOffline, TileStreamCacheMB
; SURF eox <url> <first level> <last level>          EOX WGS84 grid, 256 px, zoom = level - 3
; SURF_FALLBACK gibs <url> <top GIBS level> <last level>
; LIGHTS, WATER gibs <url> <top GIBS level>          NASA GIBS EPSG:4326 grid, 512 px
; ELEV terrarium <url> <top zoom> <last level>       Web Mercator elevation tiles, 256 px, zoom = level - 3; ELEV_SCALE metres per step
; COVER worldcover <url> <first level>               ESA WorldCover 10 m COGs, {tile} = N27W081: the Mask water bit and the Class layer
; {z} {n} grid level, {row} {col} tile

BODY Earth
SURF eox https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless/default/WGS84/{z}/{row}/{col}.jpg 1 16
SURF_FALLBACK gibs https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/BlueMarble_NextGeneration/default/500m/{n}/{row}/{col}.jpeg 7 10
LIGHTS gibs https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/VIIRS_Black_Marble/default/2016-01-01/500m/{n}/{row}/{col}.png 7
LIGHTS_BLACK 3 4 14
WATER gibs https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/OSM_Land_Water_Map/default/250m/{n}/{row}/{col}.png 8
WATER_GREY 101.5
EOX_FILL_RGB 24 44 78
ELEV terrarium https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{col}/{row}.png 15 16
ELEV_SCALE 0.5
COVER worldcover https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif 12
