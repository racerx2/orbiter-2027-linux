; not upstream (design-ground-detail 1, 4, 5): the VulkanClient's ground material sets (GroundMaterials in its cfg)
; files: Textures/GroundDetail/<material>_a.dds (colour, height) and _b.dds (normal x y, ambient occlusion), BC7, all of a set the same size; Utils/GroundMat/make.py makes them
; a scan with a direction in it (ripples, rakes, layers) swirls: each material is laid in randomly turned pieces, so only scans that look the same any way round
; SET <set> CLASS <grass> <forest> <soil> <sand> <rock> <gravel>   picked by the land class tiles, the satellite colour and the slope
; SET <set> FREE <fine> <coarse> <third> <rock>                    bodies with no land class: rock on slopes over 35 deg, the rest fine, coarse or the third in broad patches
; BODY <body> <set>                                                the satellite colour stays the ground's colour, so one set serves bodies of one kind
SET earth CLASS grass forest soil sand rock gravel
SET lunar FREE lunar_dust lunar_coarse lunar_pebbles rock_grey
SET mars FREE mars_sand mars_stony mars_crust rock_grey
BODY Earth earth
BODY Mars mars
BODY Venus mars
BODY Mercury lunar
BODY Moon lunar
BODY Phobos lunar
BODY Deimos lunar
BODY Vesta lunar
BODY Io lunar
BODY Europa lunar
BODY Ganymede lunar
BODY Callisto lunar
BODY Mimas lunar
BODY Enceladus lunar
BODY Tethys lunar
BODY Dione lunar
BODY Rhea lunar
BODY Titan lunar
BODY Hyperion lunar
BODY Iapetus lunar
BODY Miranda lunar
BODY Ariel lunar
BODY Umbriel lunar
BODY Titania lunar
BODY Oberon lunar
BODY Triton lunar
BODY Proteus lunar
BODY Nereid lunar
BODY Pluto lunar
BODY Charon lunar
