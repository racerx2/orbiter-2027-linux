# XRSound daemon test: a private PipeWire daemon with a null sink and no device modules (DaemonTest.sh)
context.properties = {
    core.daemon = true
    core.name = xrsound-test-0
    support.dbus = false
    mem.allow-mlock = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access args = { } }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = spa-node-factory
      args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
    { factory = adapter
      args = {
        factory.name = support.null-audio-sink
        node.name = xrs-null
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        object.linger = true
        adapter.auto-port-config = { mode = dsp monitor = false control = false position = preserve }
      }
    }
]
