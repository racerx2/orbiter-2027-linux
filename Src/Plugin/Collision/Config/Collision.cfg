; not upstream: settings of the collision addon (Modules/Plugin/Collision); read once when a simulation session starts
; Version of this file's defaults; the build and install upgrade older files in place and keep every other line
CollisionCfgVersion = 2
; Collisions and new damage on (1) or off (0); off still loads, saves, shows and repairs damage
CollisionModel = 1
; FALSE: contacts are detected and logged, no response is written
CollisionResponse = TRUE
; TRUE: a failed momentum check stops with an error (tests)
CollisionCheck = FALSE
; Docking and attachment zones: slow approaches of free ports or attachment points do not collide there, so Orbiter still docks or attaches
CollisionDockZone = TRUE
CollisionAttachZone = TRUE
; Log detail 0-4: 1 events, 2 also state writes, 3 also distances, 4 also poses
CollisionLog = 1
; 1: check animated meshes against the graphics client (gcCore)
ClientCheck = 0
; Vessel classes whose named meshes are probed once instead of every frame (space separated)
MeshProbe =
; Absorbed energy per kg of empty mass that destroys a vessel or a building [J/kg]; a vessel class key DestroyEnergy wins
DestroyEnergy = 1000
BuildingDestroyEnergy = 1000
; Destroyed vessels lose thrust (only with Orbiter's Damage model option)
CollisionThrustCut = TRUE
; Dents shown on vessel meshes
CollisionVisuals = TRUE
; Dent display also from the keyboard callback (focus vessel, faster after a mesh change)
CollisionKeyPass = TRUE
; Refresh the graphics client's culling sphere of a dented group
CollisionCullFix = TRUE
; Notifications: 0 none, 1 destroyed, 2 also first damage
CollisionNotify = 1
; Damage side file next to flight recordings, for playback
CollisionRecorder = TRUE
; Test keys, empty in normal use
CollisionTestRecId =
CollisionTestSlotCheck = 0
; Dent shapes: crush (flat face at the impactor) and hinge (thin parts fold); FALSE: round dents only
CollisionDentModes = TRUE
; Irregular dent outline and depth
CollisionDentNoise = TRUE
; Sharper shading of crushed and folded areas
CollisionDentFacetNormals = TRUE
; Parts tear off, glass breaks, interiors are hidden on destructive hits
CollisionBreak = TRUE
; Debris pieces alive at once, and their lifetime [s]
CollisionDebrisMax = 8
CollisionDebrisLife = 1800
; Recorder playback spawns the debris pieces as live vessels
CollisionDebrisPlayback = TRUE
; Impact effects: 1 flakes, 2 venting, 4 sparks, 8 dust (add up)
CollisionFx = TRUE
CollisionFxMask = 15
; Effect strength 0..2
CollisionFxIntensity = 1
; Effects on recorder playback
CollisionFxPlayback = TRUE
; Energy per kg of empty mass that starts venting [J/kg]
CollisionFxVentSpec = 150
; Particle streams alive at once (at most 32)
CollisionFxMaxStreams = 24
; Dust under any vessel sliding on the ground, not only wrecks
CollisionFxRollDust = FALSE
; Live structural fracture (NVIDIA Blast): ships break into pieces where the structure is overloaded
CollisionBlast = TRUE
; Structural cells per vessel mesh (8-256)
CollisionBlastCells = 64
; Energy per kg of empty mass that crushes the cells at the impact point [J/kg]
CollisionBlastESpec = 300
