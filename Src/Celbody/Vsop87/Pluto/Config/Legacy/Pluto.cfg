; === Configuration file for dwarf planet Pluto === ; not upstream: the Pluto system, converted from Jupiter.cfg
Name = Pluto
Module = Pluto

; === Physical Parameters ===
Mass = 1.3028316e+22           ; mass [kg] (plu060 GM 869.3261 km^3/s^2)
Size = 1.1883e+6               ; mean radius [m] (New Horizons, IAU pck00011)
AlbedoRGB = 0.62 0.62 0.62     ; geometric albedo (Buratti et al. 2017)

; === Atmospheric Parameters ===
; pressure, density and temperature come from the Pluto module (New Horizons profile)
AtmGasConstant = 296.8         ; specific gas constant [J/(K kg)], N2
AtmGamma = 1.4                 ; specific heat ratio c_p/c_v
AtmAltLimit = 600e3            ; [m]
AtmColor0 = 0.06 0.07 0.10     ; faint blue haze
AtmHazeColor = 0.20 0.27 0.42

; === Rotation parameters ===
; ref: IAU WGCCRE 2015 as in NAIF pck00011 (fixed pole, uniform spin)
LAN = 0.8264283218
LAN_MJD = 51544.5
Obliquity = 1.9690028654
SidRotPeriod = 551856.067123
SidRotOffset = 2.4401257420

; === Data for the Visual ===
TileFormat = 2
MaxPatchResolution = 8         ; highest sphere patch level
