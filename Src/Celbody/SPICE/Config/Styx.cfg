; === Configuration file for moon Styx (Pluto V) === ; not upstream: the Pluto system
Name = Styx
Module = spice
Body = STYX
Origin = PLUTO
Barycenter = STYX
ParentBarycenter = PLUTO BARYCENTER
; Kerberos and Styx come from JPL's plu060; orbiter.bsp doesn't have them
Kernel = Kernels\kerberos_styx.bsp
Interval = 7000 ; Nix's interval scaled by the orbital period

; === Physical Parameters ===
Mass = 6.0627007e+14           ; plu060 GM
Size = 5.2401e+3               ; radius of a sphere of its volume [m]; ellipsoid from the size in Weaver et al. 2016
AlbedoRGB = 0.65 0.65 0.65     ; Weaver et al. 2016

; === Rotation parameters ===
; pole and period from Weaver et al. 2016; nominal (the real spin is likely chaotic), prime meridian unknown
LAN = 1.120481
LAN_MJD = 51544.5
Obliquity = 0.544081
SidRotPeriod = 279936
SidRotOffset = 0

; === Data for the Visual ===
MaxPatchResolution = 0         ; drawn as Meshes/Styx.msh
